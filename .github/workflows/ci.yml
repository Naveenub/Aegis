name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Unit tests & lint ────────────────────────────────────────────────────────
  test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # GitHub Actions exports CI=true automatically. sandbox.js detects this
        # and falls back to unsandboxed direct execution when Docker is unavailable,
        # so no AEGIS_SANDBOX_MODE=local or AEGIS_SANDBOX_DISABLE=true is needed.
        # To enable full Docker-in-Docker sandboxing, add a `docker` service above
        # and remove this comment — sandbox.js will use Docker automatically.
        run: npm test

  # ── Agent persona eval gate ──────────────────────────────────────────────────
  prompt-eval:
    name: Agent prompt eval
    runs-on: ubuntu-latest
    # Run after unit tests pass so we don't burn API quota on broken code
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Check required secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            echo ""
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name:  ANTHROPIC_API_KEY"
            echo "  Value: sk-ant-<your-key>"
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run agent prompt eval
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_URL: redis://localhost:6379
