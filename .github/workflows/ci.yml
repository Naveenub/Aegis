name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Unit tests & lint ────────────────────────────────────────────────────────
  test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        # GitHub Actions exports CI=true automatically. sandbox.js detects this
        # and falls back to unsandboxed direct execution when Docker is unavailable,
        # so no AEGIS_SANDBOX_MODE=local or AEGIS_SANDBOX_DISABLE=true is needed.
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── System / real-infrastructure tests ──────────────────────────────────────
  system-test:
    name: System tests (real Redis + real git)
    runs-on: ubuntu-latest
    needs: test   # only run after unit tests pass

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Configure git identity for system tests
        run: |
          git config --global user.email "ci@aegis.test"
          git config --global user.name  "Aegis CI"

      - name: System tests — BullMQ + real git + real filesystem
        run: npm run test:system
        env:
          REDIS_URL: redis://localhost:6379
          # CI=true is set automatically by GitHub Actions — sandbox.js
          # uses unsandboxed fallback when Docker is unavailable in CI.

  # ── Agent persona eval gate ──────────────────────────────────────────────────
  prompt-eval:
    name: Agent prompt eval
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Check required secrets
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            echo ""
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name:  ANTHROPIC_API_KEY"
            echo "  Value: sk-ant-<your-key>"
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run agent prompt eval
        run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_URL: redis://localhost:6379
