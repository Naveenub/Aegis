name: aegis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    command: node server.js
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - repo:/repo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Rootless Docker-in-Docker: sandbox.js shells out to `docker run` for every
  # lint/test execution. Rather than mounting the host's own socket (which is
  # host-root-equivalent access), the worker talks to this isolated rootless
  # daemon instead — a compromised sandbox run is capped at this container's
  # unprivileged UID, not the host.
  dind:
    image: docker:27-dind-rootless
    restart: unless-stopped
    privileged: false
    environment:
      DOCKER_TLS_CERTDIR: ""   # trusted internal compose network; no TLS needed
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/fuse
      - /dev/net/tun
    volumes:
      - dind-data:/home/rootless/.local/share/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: node workers/agent-worker.js
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - repo:/repo
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy

  dlq-worker:
    build: .
    command: node workers/dlq-worker.js
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  # Shared checkout that AEGIS_REPO_ROOT / AEGIS_WORKTREES point into so the
  # server (finalise/rewind) and worker (apply/commit) see the same git state.
  repo:
  dind-data:
