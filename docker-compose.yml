name: aegis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    command: node server.js
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - repo:/repo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: node workers/agent-worker.js
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      # sandbox.js shells out to `docker run` for lint/test isolation. Mounting
      # the host socket makes those sibling containers (not Docker-in-Docker).
      # This grants the worker container host-root-equivalent access — only
      # do this on a host you trust, and prefer a dedicated Docker context /
      # rootless Docker in shared environments.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repo:/repo
    depends_on:
      redis:
        condition: service_healthy

  dlq-worker:
    build: .
    command: node workers/dlq-worker.js
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  # Shared checkout that AEGIS_REPO_ROOT / AEGIS_WORKTREES point into so the
  # server (finalise/rewind) and worker (apply/commit) see the same git state.
  repo:
