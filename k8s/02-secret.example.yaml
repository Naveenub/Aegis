# Copy to 02-secret.yaml, fill in real values, and DO NOT commit that file.
# Apply with: kubectl apply -f k8s/02-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host:5432/aegis"
  STRIPE_SECRET_KEY: "sk_live_replace_with_your_stripe_key"
  ANTHROPIC_API_KEY: "sk-ant-replace_with_your_key"
  # Optional — omit the key entirely to leave vector memory as a no-op.
  # OPENAI_API_KEY: "sk-replace_with_your_openai_key"
  AEGIS_API_KEY_DEFAULT: "replace_with_a_long_random_secret_for_default_tenant"
  # Optional — PR/MR automation, remote push, inbound webhooks.
  # AEGIS_PR_TOKEN: "ghp_xxxxxxxxxxxxxxxxxxxx"
  # AEGIS_WEBHOOK_SECRET_GITHUB: "your-github-webhook-secret"
  # AEGIS_WEBHOOK_SECRET_GITLAB: "your-gitlab-webhook-token"
