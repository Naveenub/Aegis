# Copy to 02-secret.yaml, fill in real values, and DO NOT commit that file.
# Apply with: kubectl apply -f k8s/02-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:password@host:5432/aegis"
  STRIPE_SECRET_KEY: "sk_live_replace_with_your_stripe_key"
  STRIPE_PUBLISHABLE_KEY: "pk_live_replace_with_your_publishable_key"
  STRIPE_WEBHOOK_SECRET: "whsec_replace_with_your_webhook_signing_secret"
  # From `node scripts/stripe-setup.js` output.
  STRIPE_PRICE_STARTER: "price_..."
  STRIPE_PRICE_PRO: "price_..."
  STRIPE_PRICE_ENTERPRISE: "price_..."
  STRIPE_PRICE_STARTER_WORKFLOW_RUN: "price_..."
  STRIPE_PRICE_STARTER_AGENT_STEP: "price_..."
  STRIPE_PRICE_STARTER_TOKENS: "price_..."
  STRIPE_PRICE_STARTER_SANDBOX_MINUTES: "price_..."
  STRIPE_PRICE_PRO_WORKFLOW_RUN: "price_..."
  STRIPE_PRICE_PRO_AGENT_STEP: "price_..."
  STRIPE_PRICE_PRO_TOKENS: "price_..."
  STRIPE_PRICE_PRO_SANDBOX_MINUTES: "price_..."
  STRIPE_PRICE_ENTERPRISE_WORKFLOW_RUN: "price_..."
  STRIPE_PRICE_ENTERPRISE_AGENT_STEP: "price_..."
  STRIPE_PRICE_ENTERPRISE_TOKENS: "price_..."
  STRIPE_PRICE_ENTERPRISE_SANDBOX_MINUTES: "price_..."
  # Stripe billing-portal return URL (POST /billing/portal).
  BILLING_RETURN_URL: "https://app.example.com/billing"
  # Public contact address on landing/legal pages (use a role address on your domain).
  AEGIS_CONTACT_EMAIL: "hello@your-domain.com"
  ANTHROPIC_API_KEY: "sk-ant-replace_with_your_key"
  # Optional — omit the key entirely to leave vector memory as a no-op.
  # OPENAI_API_KEY: "sk-replace_with_your_openai_key"
  AEGIS_API_KEY_DEFAULT: "replace_with_a_long_random_secret_for_default_tenant"
  # Optional — PR/MR automation, remote push, inbound webhooks.
  # AEGIS_PR_TOKEN: "ghp_xxxxxxxxxxxxxxxxxxxx"   # legacy single-repo mode only
  # AEGIS_GITHUB_APP_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\n..."
  # AEGIS_GITHUB_APP_CLIENT_SECRET: ""
  # AEGIS_GITHUB_APP_WEBHOOK_SECRET: ""
  # AEGIS_OAUTH_STATE_SECRET: ""
  # AEGIS_WEBHOOK_SECRET_GITHUB: "your-github-webhook-secret"
  # AEGIS_WEBHOOK_SECRET_GITLAB: "your-gitlab-webhook-token"
