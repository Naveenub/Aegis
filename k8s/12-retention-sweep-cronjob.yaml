apiVersion: batch/v1
kind: CronJob
metadata:
  name: aegis-retention-sweep
  namespace: aegis
spec:
  schedule: "30 3 * * *" # daily 03:30 UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: retention-sweep
              image: your-registry/aegis:latest
              command: ["node", "scripts/retention-sweep.js"]
              envFrom:
                - configMapRef:
                    name: aegis-config
                - secretRef:
                    name: aegis-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
