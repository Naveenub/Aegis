# The worker holds the app secrets, so it must never share a kernel with tenant
# code. Lint/test runs execute on the separate, secret-free aegis-sandbox
# Deployment (06a-sandbox.yaml) reached via DOCKER_HOST in the ConfigMap; the
# worktree is streamed to it, so no shared volume is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-worker
  namespace: aegis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-worker
  template:
    metadata:
      labels:
        app: aegis-worker
    spec:
      containers:
        - name: worker
          image: your-registry/aegis:latest
          command: ["node", "workers/agent-worker.js"]
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-secrets
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: sandbox-client-tls
              mountPath: /etc/docker-client
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: sandbox-client-tls
          secret:
            secretName: aegis-sandbox-client-tls # ca.pem cert.pem key.pem
            defaultMode: 0400
        - name: repo
          persistentVolumeClaim:
            claimName: aegis-repo
