# Isolated runner for tenant lint/test code. Deliberately holds NO secrets, NO
# repo volume and NO service-account token: the worker streams each worktree
# over the Docker API (sandbox.js "stream" transport) and only stdout comes back.
#
# The Docker API is mutual-TLS only (port 2376). Create the two Secrets before
# applying: see k8s/README.md item 4 (scripts/provision-runner.sh certs).
#
# dockerd needs privileged: true, which is only safe inside a microVM guest.
# runtimeClassName below is REQUIRED — set it to a Kata/Firecracker-style
# RuntimeClass on your cluster. If it does not exist the pod stays Pending and
# sandboxed steps fail closed. Never run this Deployment on the default runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-sandbox
  namespace: aegis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-sandbox
  template:
    metadata:
      labels:
        app: aegis-sandbox
    spec:
      runtimeClassName: kata # CHANGE to your microVM RuntimeClass (scripts/sandbox-setup.sh runtimeclass)
      automountServiceAccountToken: false
      containers:
        - name: dockerd
          image: docker:27-dind
          # Mutual TLS: the Docker API is root on this daemon, so it never listens
          # in plaintext. Only a client holding a cert signed by the CA can connect,
          # even from inside the cluster or if NetworkPolicy is not enforced.
          args:
            - "--host=tcp://0.0.0.0:2376"
            - "--host=unix:///var/run/docker.sock"
            - "--tlsverify"
            - "--tlscacert=/certs/ca.pem"
            - "--tlscert=/certs/server-cert.pem"
            - "--tlskey=/certs/server-key.pem"
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # disable the image's auto-generated certs; we mount our own
          securityContext:
            privileged: true # confined to the microVM guest by runtimeClassName
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: server-tls
              mountPath: /certs
              readOnly: true
          readinessProbe:
            exec:
              command: ["docker", "info"] # local unix socket, no TLS needed
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: docker-data
          emptyDir: {} # sandbox image re-pulls on pod restart, by design
        - name: server-tls
          secret:
            secretName: aegis-sandbox-server-tls # ca.pem server-cert.pem server-key.pem
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-sandbox
  namespace: aegis
spec:
  selector:
    app: aegis-sandbox
  ports:
    - port: 2376
      targetPort: 2376
---
# The Docker API is root on this daemon: only the worker may reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-sandbox-ingress
  namespace: aegis
spec:
  podSelector:
    matchLabels:
      app: aegis-sandbox
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aegis-worker
      ports:
        - port: 2376
