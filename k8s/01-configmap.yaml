apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-config
  namespace: aegis
data:
  PORT: "3000"
  AEGIS_TENANTS: "default"
  CLAUDE_AUTONOMY: "true"
  MODE: "autonomous"
  REDIS_URL: "redis://redis:6379"
  AEGIS_REPO_ROOT: "/repo"
  AEGIS_REPOS_BASE: "/repo/tenants"
  AEGIS_WORKTREES: "/repo/.aegis-worktrees"
  AEGIS_GITHUB_APP_ID: ""
  AEGIS_GITHUB_APP_SLUG: ""
  AEGIS_GITHUB_APP_CLIENT_ID: ""
  # GitLab / Bitbucket per-tenant OAuth (secrets go in the Secret):
  AEGIS_PUBLIC_URL: ""
  AEGIS_GITLAB_OAUTH_CLIENT_ID: ""
  AEGIS_BITBUCKET_OAUTH_CLIENT_ID: ""
  # Model routing: planner/review-guard use CHEAP, everything else BUILD.
  # Leave unset to use the built-in defaults; AEGIS_MODEL (legacy) pins both.
  AEGIS_MODEL_BUILD: ""
  AEGIS_MODEL_CHEAP: ""
  # "0" = refuse at the spend cap instead of retrying on the cheap model.
  AEGIS_CAP_FALLBACK: "1"
  AEGIS_IDEM_TTL_SECONDS: "604800"
  AEGIS_CONCURRENCY_CRITICAL: "8"
  AEGIS_CONCURRENCY_HIGH: "5"
  AEGIS_CONCURRENCY_NORMAL: "3"
  AEGIS_CONCURRENCY_LOW: "1"
  AEGIS_CONCURRENCY_LEASE_MS: "120000"
  AEGIS_MEMORY_TTL_DAYS: "30"
  AEGIS_RETENTION_JOBS_DAYS: "90"
  AEGIS_RETENTION_WORKFLOWS_DAYS: "90"
  AEGIS_EVICTION_INTERVAL_HOURS: "1"
  AEGIS_GIT_TENANT_LOCK_TTL_MS: "10000"
  AEGIS_GIT_LOCK_TTL_MS: "15000"
  AEGIS_MERGE_STRATEGY: "rebase"
  DLQ_MAX_RETRIES: "2"
  DLQ_BASE_DELAY_MS: "30000"
  DLQ_STALE_SWEEP_MS: "900000"
  DLQ_STALE_THRESHOLD_MS: "3600000"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "60"
  RATE_LIMIT_BURST_MS: "5000"
  RATE_LIMIT_BURST_MAX: "20"
  # sandbox.js talks to the isolated aegis-sandbox Service (06a-sandbox.yaml);
  # DOCKER_HOST being set selects the stream transport automatically.
  # mTLS only; client certs come from the aegis-sandbox-client-tls Secret
  # mounted at /etc/docker-client in the worker (06-worker.yaml).
  DOCKER_HOST: "tcp://aegis-sandbox:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/etc/docker-client"
  # Build from Dockerfile.sandbox — plain node:22-alpine has no eslint/vitest.
  AEGIS_SANDBOX_IMAGE: "your-registry/aegis-sandbox:latest"
  AEGIS_SANDBOX_MEMORY: "512m"
  AEGIS_SANDBOX_CPUS: "1"
  AEGIS_SANDBOX_TIMEOUT_MS: "60000"
