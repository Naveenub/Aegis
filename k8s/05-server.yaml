apiVersion: v1
kind: Service
metadata:
  name: aegis-server
  namespace: aegis
spec:
  selector:
    app: aegis-server
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-server
  namespace: aegis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-server
  template:
    metadata:
      labels:
        app: aegis-server
    spec:
      containers:
        - name: server
          image: your-registry/aegis:latest # build from repo Dockerfile, push, replace
          command: ["node", "server.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: aegis-config
            - secretRef:
                name: aegis-secrets
          volumeMounts:
            - name: repo
              mountPath: /repo
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: aegis-repo
