# Render Blueprint — one-click deploy for AEGIS.
# https://render.com/docs/blueprint-spec
#
# Deliberately NOT a 1:1 port of docker-compose.yml's server/worker/dlq-worker
# split. Two things compose gets from a single Docker host don't exist across
# separate Render services:
#
#   1. Shared filesystem. server (finalise/rewind) and worker (apply/commit)
#      must see the same git checkout (see k8s/README.md's RWX PVC note) —
#      Render disks are per-service, not shared across services.
#   2. Docker-in-Docker. sandbox.js shells out to `docker run`; Render grants
#      no privileged/nested-Docker access (same restriction on Railway).
#
# Fix for (1): run all three processes in one service so they share one
# container's filesystem + attached disk. Fix for (2): AEGIS_SANDBOX_MODE=local
# — agent-generated code lint/tests run directly on the dyno, not walled off
# by sandbox.js's container boundary.
#
# Net effect: this is a single-node demo/eval deploy (no self-serve billing), not the isolated,
# horizontally-scaled topology docker-compose.yml or k8s/ gives you. For a
# production multi-tenant deployment with real sandbox isolation, self-host
# with docker-compose (dind sidecar) or k8s/ instead.

databases:
  - name: aegis-postgres
    plan: free
    databaseName: aegis
    user: aegis

services:
  # Redis Stack — plain Render Key Value doesn't ship FT.SEARCH, which
  # vector-memory.js requires (see k8s/README.md item 2).
  - type: pserv
    name: aegis-redis
    runtime: image
    plan: starter
    image:
      url: docker.io/redis/redis-stack-server:latest
    disk:
      name: aegis-redis-data
      mountPath: /data

  - type: web
    name: aegis
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      sh -c "export REDIS_URL=redis://$REDIS_HOSTPORT; node server.js & node workers/agent-worker.js & node workers/dlq-worker.js & wait -n"
    plan: starter
    healthCheckPath: /health
    disk:
      name: aegis-repo
      mountPath: /repo
    envVars:
      - key: AEGIS_REPO_ROOT
        value: /repo
      - key: REDIS_HOSTPORT
        fromService:
          name: aegis-redis
          type: pserv
          property: hostport
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AEGIS_API_KEY_DEFAULT
        generateValue: true
      - key: AEGIS_AUDIT_SIGNING_KEY
        generateValue: true
      - key: AEGIS_TENANTS
        value: default
      - key: CLAUDE_AUTONOMY
        value: "true"
      # Unsandboxed: tenant code runs directly on this service. Because of that,
      # self-serve signup (/signup, /signup/config) is DISABLED while this is
      # `local` (see engine/billing/signup.js). Do not set
      # AEGIS_ALLOW_UNSANDBOXED_SIGNUP=true for paying customers — launch paid
      # on docker-compose (dind) or k8s/ instead.
      - key: AEGIS_SANDBOX_MODE
        value: local
      # ── Stripe (set in the Render dashboard; sync: false = never stored in git) ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: STRIPE_PRICE_STARTER_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_STARTER_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_STARTER_TOKENS
        sync: false
      - key: STRIPE_PRICE_STARTER_SANDBOX_MINUTES
        sync: false
      - key: STRIPE_PRICE_PRO_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_PRO_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_PRO_TOKENS
        sync: false
      - key: STRIPE_PRICE_PRO_SANDBOX_MINUTES
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_TOKENS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_SANDBOX_MINUTES
        sync: false
      - key: BILLING_RETURN_URL
        sync: false
      - key: AEGIS_CONTACT_EMAIL
        sync: false

  - type: cron
    name: aegis-billing-flush
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run billing:flush
    plan: starter
    schedule: "0 * * * *" # hourly
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false

  # Deletes unpaid signups (pending > 48h) and their Stripe customers.
  - type: cron
    name: aegis-pending-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run billing:cleanup
    plan: starter
    schedule: "0 3 * * *" # daily 03:00 UTC
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
