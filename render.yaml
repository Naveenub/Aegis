# Render Blueprint — one-click deploy for AEGIS.
# https://render.com/docs/blueprint-spec
#
# Deliberately NOT a 1:1 port of docker-compose.yml's server/worker/dlq-worker
# split. Two things compose gets from a single Docker host don't exist across
# separate Render services:
#
#   1. Shared filesystem. server (finalise/rewind) and worker (apply/commit)
#      must see the same git checkout (see k8s/README.md's RWX PVC note) —
#      Render disks are per-service, not shared across services.
#   2. Docker-in-Docker. Render grants no privileged/nested-Docker access (same
#      restriction on Railway), so this service has no local daemon.
#
# Fix for (1): run all three processes in one service so they share one
# container's filesystem + attached disk. Fix for (2): sandbox.js talks to a
# REMOTE Docker daemon (DOCKER_HOST) on an isolated runner host you provision —
# a dedicated VM, or a host running gVisor/Firecracker/Kata. Tenant code never
# runs on this service. The worktree is streamed to the runner; nothing is
# mounted. Fail-closed: if DOCKER_HOST is unset or unreachable, every lint/test
# step is blocked rather than run locally.
#
# The runner must be a machine you are happy to treat as disposable and that
# holds no secrets or credentials, with its Docker API exposed over mutual TLS
# only. Create the Render Secret Files ca.pem, cert.pem, key.pem (client cert
# for that daemon); they appear in /etc/secrets, which DOCKER_CERT_PATH below
# points the docker CLI at. Build Dockerfile.sandbox, push it where the runner
# can pull it, and set AEGIS_SANDBOX_IMAGE to it.

databases:
  - name: aegis-postgres
    plan: free
    databaseName: aegis
    user: aegis

services:
  # Redis Stack — plain Render Key Value doesn't ship FT.SEARCH, which
  # vector-memory.js requires (see k8s/README.md item 2).
  - type: pserv
    name: aegis-redis
    runtime: image
    plan: starter
    image:
      url: docker.io/redis/redis-stack-server:latest
    disk:
      name: aegis-redis-data
      mountPath: /data

  - type: web
    name: aegis
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      sh -c "export REDIS_URL=redis://$REDIS_HOSTPORT; node server.js & node workers/agent-worker.js & node workers/dlq-worker.js & wait -n"
    plan: starter
    healthCheckPath: /health
    disk:
      name: aegis-repo
      mountPath: /repo
    envVars:
      - key: AEGIS_REPO_ROOT
        value: /repo
      - key: REDIS_HOSTPORT
        fromService:
          name: aegis-redis
          type: pserv
          property: hostport
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AEGIS_API_KEY_DEFAULT
        generateValue: true
      - key: AEGIS_AUDIT_SIGNING_KEY
        generateValue: true
      - key: AEGIS_TENANTS
        value: default
      - key: CLAUDE_AUTONOMY
        value: "true"
      # Isolated remote runner (see header). Do NOT set AEGIS_SANDBOX_MODE=local
      # here: that runs tenant code on this service and is for local dev only.
      - key: DOCKER_HOST
        sync: false # e.g. tcp://runner.example.com:2376
      - key: DOCKER_TLS_VERIFY
        value: "1"
      - key: DOCKER_CERT_PATH
        value: /etc/secrets
      - key: AEGIS_SANDBOX_IMAGE
        sync: false # image built from Dockerfile.sandbox
      # ── Stripe (set in the Render dashboard; sync: false = never stored in git) ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: STRIPE_PRICE_STARTER_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_STARTER_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_STARTER_TOKENS
        sync: false
      - key: STRIPE_PRICE_STARTER_SANDBOX_MINUTES
        sync: false
      - key: STRIPE_PRICE_PRO_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_PRO_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_PRO_TOKENS
        sync: false
      - key: STRIPE_PRICE_PRO_SANDBOX_MINUTES
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_WORKFLOW_RUN
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_AGENT_STEP
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_TOKENS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE_SANDBOX_MINUTES
        sync: false
      - key: BILLING_RETURN_URL
        sync: false
      - key: AEGIS_CONTACT_EMAIL
        sync: false

  - type: cron
    name: aegis-billing-flush
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run billing:flush
    plan: starter
    schedule: "0 * * * *" # hourly
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false

  # Deletes unpaid signups (pending > 48h) and their Stripe customers.
  - type: cron
    name: aegis-pending-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run billing:cleanup
    plan: starter
    schedule: "0 3 * * *" # daily 03:00 UTC
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-postgres
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
